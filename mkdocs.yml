site_name: Džiugas' Dotfiles
site_description: Cross-platform dotfiles for macOS, Linux and Windows, and documentation for a self-hosted homelab.
site_url: https://docs.peciulevicius.com

repo_name: peciulevicius/.dotfiles
repo_url: https://github.com/peciulevicius/.dotfiles

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Start Here: START_HERE.md

  - Setup:
      - How to Install: HOW_TO_INSTALL.md
      - Mac mini setup (historical): HOME_SERVER.md

  - Homelab:
      - Outstanding work: HOME_SERVER_TODO.md
      - Changelog: HOME_SERVER_CHANGELOG.md
      - Reference: HOME_SERVER_REFERENCE.md
      - NAS: NAS.md
      - Credential migration: CREDENTIAL_MIGRATION.md
      - Email: guides/EMAIL.md

  - Claude Code:
      - Claude Code guide: CLAUDE_CODE_GUIDE.md
      - Workflow: guides/CLAUDE_WORKFLOW.md

  - Tools:
      - Modern CLI tools: MODERN_CLI_TOOLS.md
      - Utility scripts: UTILITY_SCRIPTS.md
      - Tutorials: tutorials/TOOL_TUTORIALS.md

  - Self-Hosted:
      - Services: SERVICES.md
      - Notes: guides/NOTES.md
      - Books and audiobooks: guides/BOOKS.md
      - Kindle setup: guides/KINDLE_SETUP.md
      - De-Googling: guides/DEGOOGLE.md
      - De-Google alternatives: guides/DEGOOGLE_ALTERNATIVES.md
      - Self-hosted AI: guides/SELF_HOSTED_AI.md
      - Octopus Deploy (evaluated): guides/OCTOPUS_DEPLOY.md

  - Reference:
      - Configuration: CONFIG_GUIDE.md
      - Symlinks: SYMLINKS.md
