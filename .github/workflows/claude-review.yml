name: Claude review

# Code review on every PR by Claude Code, on the owner's Max plan
# (secret CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`). Skips cleanly
# until the secret exists. Replaces the Codex bot after 2026-10-29.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip without a token
        if: env.HAS_TOKEN != 'true'
        run: echo "CLAUDE_CODE_OAUTH_TOKEN not set; skipping review."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request like a senior engineer. Focus on real
            problems: bugs and edge cases, security (secrets, auth, data
            storage, keys shipped in a client bundle, injection), performance,
            and maintainability. Skip style nits a linter would catch.
            Read AGENTS.md / CLAUDE.md for the repo's own rules and check the
            change follows them.

            Put specific findings as inline comments on the exact lines, each
            with a severity (P1 must fix / P2 should fix / P3 consider) and a
            concrete fix. Then post ONE summary comment: what the PR does, the
            findings by severity, and a verdict ("approve" or "changes
            needed"). If you find nothing, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
