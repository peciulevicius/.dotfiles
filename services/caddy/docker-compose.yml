# Caddy + Sablier — scale-to-zero reverse proxy for the homelab.
# Docs: services/caddy/README.md
#
# cloudflared sends the scale-to-zero hostnames to 127.0.0.1:8880 (this
# Caddy), which asks Sablier whether the target container(s) are running,
# starts them on demand, and reverse-proxies once they're ready. A second
# listener on the Tailscale IP does the same for the Tailscale-only apps
# (Jellyseerr, Bazarr, Odysseus) that used to publish their ports directly —
# added in phase 2, see the README rollout table.
#
# Always-on services keep their direct tunnel route / port publish — this
# stack only fronts the services labelled sablier.enable=true.
#
# Rolled out in phases (README "Rollout"). Networks/ports below only cover
# what's actually wired into the Caddyfile so far — each phase's commit adds
# its slice here too.

name: caddy

services:
  sablier:
    container_name: sablier
    image: sablierapp/sablier:1.18.0
    restart: unless-stopped
    command:
      - start
      - --provider.name=docker
      - --sessions.default-duration=30m
      - --sessions.expiration-interval=5s
      - --logging.level=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  caddy:
    container_name: caddy
    build: .
    restart: unless-stopped
    depends_on:
      - sablier
    ports:
      # Tunnel target — cloudflared talks to this over loopback only.
      - "127.0.0.1:8880:8880"
      # Phase 2 (2026-09-27): Tailscale-only apps. Caddy owns the
      # Tailscale-facing port instead of the app publishing it directly —
      # see README "Tailscale-only apps".
      - "${TAILSCALE_IP:-100.81.171.49}:5055:5055"   # Jellyseerr
      - "${TAILSCALE_IP:-100.81.171.49}:6767:6767"   # Bazarr
      - "${TAILSCALE_IP:-100.81.171.49}:7001:7001"   # Odysseus
      # Phase 3 (2026-09-27): media apps also reachable directly on the
      # Tailscale IP (LAN clients, TV apps) — same port-ownership pattern.
      - "${TAILSCALE_IP:-100.81.171.49}:8083:8083"   # Calibre-Web
      - "${TAILSCALE_IP:-100.81.171.49}:13378:13378" # Audiobookshelf
      - "${TAILSCALE_IP:-100.81.171.49}:8096:8096"   # Jellyfin
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      - default
      # Phase 1 (2026-09-27): Stirling-PDF, IT-Tools
      - stirling-pdf
      - it-tools
      # Phase 2 (2026-09-27): Paperless, Nextcloud, Odysseus, Linkwarden,
      # Jellyseerr, Bazarr
      - paperless-ngx
      - nextcloud
      - odysseus_default
      - linkwarden
      - media
      # Phase 3 (2026-09-27): Calibre-Web, Audiobookshelf, Jellyfin
      - calibre-web
      - audiobookshelf
      - jellyfin

volumes:
  caddy-data:

networks:
  default:
  stirling-pdf:
    external: true
  it-tools:
    external: true
  paperless-ngx:
    external: true
  nextcloud:
    external: true
  odysseus_default:
    external: true
  linkwarden:
    external: true
  media:
    external: true
  calibre-web:
    external: true
  audiobookshelf:
    external: true
  jellyfin:
    external: true
