; CouchDB settings required by Obsidian Self-hosted LiveSync.
; Keep this file ASCII-only - CouchDB's config parser fails on non-ASCII
; bytes and the container then exits with no log output at all.
;
; The [cors] block is not optional: mobile Obsidian runs from the
; app://obsidian.md origin and cannot connect without it.

[couchdb]
single_node = true
max_document_size = 50000000

[chttpd]
require_valid_user = true
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
require_valid_user = true
authentication_redirect = /_utils/session.html

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
credentials = true
origins = app://obsidian.md,capacitor://localhost,http://localhost
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
