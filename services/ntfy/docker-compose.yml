# ntfy — phone push notifications, standalone always-on instance.
# Upstream: https://github.com/binwiederhier/ntfy (Apache-2.0 / GPL-3.0)
#
# This is a SEPARATE instance from the one bundled in services/odysseus (port
# 8091, no auth, ephemeral cache). That one stays put — Odysseus is on-demand
# (scale-to-zero) and its ntfy stops with it, which is fine for chat reminders
# but wrong for the Coach agent's daily push: the phone must be able to
# receive a push whenever Paperclip runs, regardless of what else is asleep.
# So this instance is always-on, independent of any other stack, with auth
# enabled (deny-all default) since it will hold a private coaching topic.
#
# Exposure: Tailscale + localhost only, same pattern as Paperclip. No tunnel
# hostname — the ntfy iOS/Android app supports a self-hosted server address
# directly over Tailscale, so a public hostname isn't needed (see README for
# the optional-tunnel note).

name: ntfy

services:
  ntfy:
    container_name: ntfy
    image: binwiederhier/ntfy
    command: serve
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NTFY_PORT:-8095}:80"
      - "100.81.171.49:${NTFY_PORT:-8095}:80"
    environment:
      NTFY_BASE_URL: "${NTFY_BASE_URL:-http://100.81.171.49:8095}"
      NTFY_LISTEN_HTTP: ":80"
      # Persistent user/token database — survives recreate, unlike the
      # Odysseus instance's cache-only setup. Auth is the actual gate: every
      # topic denies read+write by default, and each user/token gets explicit
      # per-topic access (see README "First-time setup").
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      # Persistent message cache so a publish can be verified with a poll
      # (?poll=1) after the fact, and so a missed push is still there when the
      # phone reconnects. 12h is ntfy's own default.
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 12h
      NTFY_UPSTREAM_BASE_URL: ""
      NTFY_ENABLE_METRICS: "false"
    volumes:
      - ./data/auth:/var/lib/ntfy
      - ./data/cache:/var/cache/ntfy
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:80/v1/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  default:
    name: ntfy
