# beets config — repo copy: services/beets/config.yaml
# Staged to ~/services/beets/config.yaml and bind-mounted to /config/config.yaml.
# Edit here, then re-copy and `docker compose up -d` (see README.md).

directory: /music/Library
library: /config/musiclibrary.blb

# musicbrainz is the autotagger's metadata source (a plugin since beets 2.4);
# web is what the container's main process runs (`beet web`, port 8337).
plugins: musicbrainz fetchart embedart lastgenre scrub duplicates web

import:
  move: yes
  write: yes
  quiet: yes
  # No confident MusicBrainz match → import with the file's own tags rather
  # than leaving it stuck in Incoming/.
  quiet_fallback: asis
  resume: no
  log: /config/import.log

paths:
  default: $albumartist/$album%aunique{}/$track $title
  singleton: Singles/$artist - $title

fetchart:
  auto: yes

embedart:
  auto: yes

lastgenre:
  auto: yes
  source: album

scrub:
  auto: yes

web:
  host: 0.0.0.0
  port: 8337

replace:
  '^\.': _
  '[\x00-\x1f]': _
  '[<>:"\?\*\|]': _
  '\.$': _
  '\s+$': ''
