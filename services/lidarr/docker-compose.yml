# Lidarr — music collection management and automation
# Docs: https://lidarr.audio/

name: lidarr

services:
  lidarr:
    container_name: lidarr
    image: lscr.io/linuxserver/lidarr:latest
    restart: unless-stopped
    ports:
      - "${LIDARR_PORT:-8686}:8686"
    volumes:
      - ./data:/config
      - ${MEDIA_DIR:-/Volumes/media}:/media
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Vilnius}

networks:
  default:
    name: media
    external: true
