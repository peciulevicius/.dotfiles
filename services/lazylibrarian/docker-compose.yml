# LazyLibrarian — ebook + audiobook automation (Readarr alternative)
# Docs: https://lazylibrarian.gitlab.io
# Metadata: Google Books, OpenLibrary, LibraryThing (no broken GoodReads dependency)
# Integrates with: Prowlarr, Calibre Content Server, Transmission
# UI: http://localhost:5299

name: lazylibrarian

services:
  lazylibrarian:
    container_name: lazylibrarian
    image: lscr.io/linuxserver/lazylibrarian:latest
    restart: unless-stopped
    ports:
      - "${LAZYLIBRARIAN_PORT:-5299}:5299"
    volumes:
      - ./data:/config
      - ${BOOKS_DIR:-/Volumes/books}:/books
      - ${AUDIOBOOKS_DIR:-/Users/dziugaspeciulevicius/services/audiobookshelf/data/audiobooks}:/audiobooks
      - ${DOWNLOADS_DIR:-/Volumes/media/downloads}:/downloads
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Vilnius}
      DOCKER_MODS: linuxserver/mods:lazylibrarian-ffmpeg
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - default
      - calibre-web
      - media

networks:
  default:
    name: lazylibrarian
  calibre-web:
    external: true
  media:
    external: true
