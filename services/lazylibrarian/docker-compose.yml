# LazyLibrarian — ebook + audiobook automation. The book pipeline;
# Readarr was removed 2026-09-19.
# Docs: https://lazylibrarian.gitlab.io
# Metadata: Google Books, OpenLibrary, LibraryThing (no broken GoodReads dependency)
# Integrates with: Prowlarr, Calibre Content Server, Transmission
# UI: http://localhost:5299

name: lazylibrarian

services:
  lazylibrarian:
    container_name: lazylibrarian
    image: lscr.io/linuxserver/lazylibrarian:latest
    restart: unless-stopped
    ports:
      - "${LAZYLIBRARIAN_PORT:-5299}:5299"
    volumes:
      - ./data:/config
      - ${BOOKS_DIR:-/Volumes/books}:/books
      - audiobooks:/audiobooks
      - downloads:/downloads
    environment:
      UMASK: "000"
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Vilnius}
      DOCKER_MODS: linuxserver/mods:lazylibrarian-ffmpeg
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - default
      - calibre-web
      - media

networks:
  default:
    name: lazylibrarian
  calibre-web:
    external: true
  media:
    external: true

# NAS shares over NFS, mounted by Docker's VM directly instead of the macOS
# SMB mounts under /Volumes (those went stale after NAS reboots). Same paths
# inside the containers. See docs/HOME_SERVER_REFERENCE.md → NAS over NFS.
volumes:
  audiobooks:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_IP:-192.168.1.73},nfsvers=3,nolock,hard,rw"
      device: ":/volume1/audiobooks"
  downloads:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_IP:-192.168.1.73},nfsvers=3,nolock,hard,rw"
      device: ":/volume1/media/downloads"
