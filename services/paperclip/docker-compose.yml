# Paperclip — open-source multi-agent orchestration ("a company of AI agents")
# Upstream: https://github.com/paperclipai/paperclip  (MIT)
# UI: http://100.81.171.49:3100 (Tailscale) or http://127.0.0.1:3100 — no tunnel.
#
# Single container, embedded PostgreSQL (the upstream quickstart shape). A
# separate postgres:17 container was rejected: the host is swap-bound and one
# fewer resident process is the point. Everything lives in ./data (mounted at
# /paperclip, which is also $HOME inside the container):
#   instances/default/db/        live embedded Postgres  -> NOT backed up raw
#   instances/default/data/backups/  Paperclip's own pg dumps -> backed up
#   .claude/ .codex/ .gemini/    agent CLI logins done via `docker exec`
#
# Agents run INSIDE this container: the image ships the claude, codex, gemini
# and opencode CLIs, and the *_local adapters exec them here. See README.md.
#
# Pinned to a stable release tag. Watchtower is deliberately disabled: stable
# releases carry DB migrations, so upgrade by bumping the tag on purpose.

name: paperclip

services:
  paperclip:
    container_name: paperclip
    # Fixed hostname: Gemini CLI encrypts its stored API key/login with a key
    # derived from hostname + username. Docker's default hostname is the
    # container ID, which changes on every recreate, so the Gemini login broke
    # ("Corrupted credentials file") after each `docker compose up -d`.
    hostname: paperclip
    image: ghcr.io/paperclipai/paperclip:2026.916.1
    restart: unless-stopped
    # Upstream's backstop against leaked agent subprocesses (tini is PID 1).
    pids_limit: 2048
    # 1536m -> 2g on 2026-09-26: idle anon RSS had grown to ~1.2GiB with two
    # companies, memory.events showed the cap hit 1500+ times, and each agent
    # run adds a 300-500MB CLI process. Raised only because host free memory
    # was 37% (rule: raise only when memory_pressure free >= 30%).
    # 2g -> 3g on 2026-09-26: memory.events max had reached 12,687 at 2g with
    # no agent running. Paid for by making Paperless, Nextcloud, Stirling,
    # IT-Tools, Odysseus and FlareSolverr on-demand (~2.2GB freed in the VM).
    # Not 3.5g: host free stayed 33% and swap didn't drop (rule for 3.5g was
    # free >= 45% and falling swap).
    mem_limit: 3g
    ports:
      # Localhost + the Mac mini's Tailscale IP only — not LAN, not the tunnel.
      - "127.0.0.1:${PAPERCLIP_PORT:-3100}:3100"
      - "100.81.171.49:${PAPERCLIP_PORT:-3100}:3100"
    # Secrets + optional agent credentials (CLAUDE_CODE_OAUTH_TOKEN, …).
    env_file: .env
    environment:
      HOST: "0.0.0.0"
      PORT: "3100"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://100.81.171.49:3100}"
      # Close sign-ups once the first admin has claimed the instance (README).
      PAPERCLIP_AUTH_DISABLE_SIGN_UP: "${PAPERCLIP_AUTH_DISABLE_SIGN_UP:-false}"
      # Daily dump, 14 days — rclone ships these to R2 instead of the live db/.
      PAPERCLIP_DB_BACKUP_ENABLED: "true"
      PAPERCLIP_DB_BACKUP_INTERVAL_MINUTES: "1440"
      PAPERCLIP_DB_BACKUP_RETENTION_DAYS: "14"
      PAPERCLIP_TELEMETRY_DISABLED: "1"
    volumes:
      - ./data:/paperclip
      # Weekly reports feed for the Homelab company, written on the HOST by
      # scripts/utils/paperclip-reports.sh (cron, Sunday 09:30). Read-only:
      # agents read reports and raise decisions, they never change servers.
      # ⚠️ Mounted at /reports, NOT under /paperclip: the image's entrypoint
      # runs `chown -R /paperclip` as root on every start and exits non-zero on
      # a read-only mount there -> crash loop (hit 2026-09-26).
      - ./reports:/reports:ro
      # Coach agent's persistent athlete memory (adaptive-endurance-coach
      # skill format: athlete_profile.md, metrics/, plans/, coaching_notes.md,
      # …). Same tree Claude Code and Odysseus already read/write on the host
      # at ~/.training — nightly R2 backup already covers it, this just gives
      # the in-container Coach agent the same path. Read-write, and NOT under
      # /paperclip for the same reason as /reports above: the entrypoint's
      # `chown -R /paperclip` at every start fails on a mount it doesn't own
      # cleanly and crash-loops (hit 2026-09-26 with /reports).
      - ${HOME}/.training:/training
      # Shared AI memory (plain markdown, local git repo, backed up to R2 +
      # NAS) that every agent reads/writes — Paperclip agents, Odysseus, Claude
      # Code. Read-write; outside /paperclip for the same chown reason.
      # Rules for agents live in /ai-memory/README.md.
      - ${HOME}/ai-memory:/ai-memory
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3100/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  default:
    name: paperclip
