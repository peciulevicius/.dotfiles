# Vaultwarden — Bitwarden-compatible password manager server
# Docs: https://github.com/dani-garcia/vaultwarden/wiki

name: vaultwarden

services:
  vaultwarden:
    container_name: vaultwarden
    image: vaultwarden/server:1.35.4
    restart: unless-stopped
    ports:
      - "${VW_PORT:-8001}:80"
    volumes:
      - ./data:/data
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN required}
      DOMAIN: ${DOMAIN:-https://localhost:8001}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-false}
      # Overridable so a login problem can actually be diagnosed —
      # hardcoding this meant LOG_LEVEL in .env was silently ignored.
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      EXTENDED_LOGGING: ${EXTENDED_LOGGING:-true}
      # Behind Cloudflare Tunnel, without this Vaultwarden logs every client as
      # the same bogus IP, which makes login rate-limiting global and the logs
      # useless for telling devices apart.
      IP_HEADER: ${IP_HEADER:-CF-Connecting-IP}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  default:
    name: vaultwarden
