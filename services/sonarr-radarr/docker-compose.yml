# Sonarr + Radarr + Prowlarr — media automation stack
# Sonarr: TV show management — https://sonarr.tv
# Radarr: Movie management — https://radarr.video
# Prowlarr: Indexer manager — https://prowlarr.com

name: sonarr-radarr

services:
  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:4.0.20
    restart: unless-stopped
    ports:
      - "${SONARR_PORT:-8989}:8989"
    volumes:
      - ./data/sonarr:/config
      - media:/media
    environment:
      UMASK: "000"
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Vilnius}

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:6.4.4
    restart: unless-stopped
    ports:
      - "${RADARR_PORT:-7878}:7878"
    volumes:
      - ./data/radarr:/config
      - media:/media
    environment:
      UMASK: "000"
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Vilnius}

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:2.6.5
    restart: unless-stopped
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    volumes:
      - ./data/prowlarr:/config
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Vilnius}
    dns:
      - 8.8.8.8
      - 8.8.4.4

  flaresolverr:
    container_name: flaresolverr
    # Manual on-demand (scripts/utils/ondemand.sh). The profile keeps a plain
    # `docker compose up -d` of this stack from starting it — that's what woke
    # it on 2026-09-27. Naming it explicitly (`up -d flaresolverr`) still works.
    profiles: ["ondemand"]
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-Europe/Vilnius}

networks:
  default:
    name: media

# NAS shares over NFS, mounted by Docker's VM directly instead of the macOS
# SMB mounts under /Volumes (those went stale after NAS reboots). Same paths
# inside the containers. See docs/HOME_SERVER_REFERENCE.md → NAS over NFS.
volumes:
  media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_IP:-192.168.1.73},nfsvers=3,nolock,hard,rw"
      device: ":/volume1/media"
