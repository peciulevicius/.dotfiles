# Jellyfin — media server (movies, TV shows)
# Docs: https://jellyfin.org/docs/

name: jellyfin

services:
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:10.11.11
    restart: unless-stopped
    # Scale-to-zero via Caddy + Sablier (services/caddy), phase 3, 2h idle
    # (long enough not to cut off playback). Caddy now also owns the
    # Tailscale-facing port (100.81.171.49:8096) so the TV app/LAN clients
    # wake it too — this bind is loopback-only debug access. The image
    # already ships a healthcheck (confirmed via `docker inspect`), so
    # Sablier correctly waits for `healthy`, not just `running`.
    labels:
      - "sablier.enable=true"
      - "sablier.group=jellyfin"
      # WUD (services/wud): only plain X.Y.Z tags count as updates (skips
      # dated nightlies / -lsNNN rebuilds). Applies on the next recreate.
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"
    ports:
      - "127.0.0.1:${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - ./data/config:/config
      - ./data/cache:/cache
      - media-movies:/media/movies
      - media-tv:/media/tv
    environment:
      TZ: ${TZ:-Europe/Vilnius}

networks:
  default:
    name: jellyfin

# NAS shares over NFS, mounted by Docker's VM directly instead of the macOS
# SMB mounts under /Volumes (those went stale after NAS reboots). Same paths
# inside the containers. See docs/HOME_SERVER_REFERENCE.md → NAS over NFS.
volumes:
  media-movies:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_IP:-192.168.1.73},nfsvers=3,nolock,hard,rw"
      device: ":/volume1/media/movies"
  media-tv:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_IP:-192.168.1.73},nfsvers=3,nolock,hard,rw"
      device: ":/volume1/media/tv"
