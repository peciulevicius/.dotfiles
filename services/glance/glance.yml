pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: server-stats

          - type: dns-stats
            service: pihole-v6
            url: http://host.docker.internal:8053
            password: ${PIHOLE_PASSWORD}

          - type: repository
            repository: peciulevicius/.dotfiles
            token: ${GITHUB_TOKEN}

          - type: calendar

      - size: full
        widgets:
          - type: monitor
            title: Services
            sites:
              - title: Vaultwarden
                url: https://vault.peciulevicius.com
                check-url: http://vaultwarden:80/
                icon: si:bitwarden
              - title: Immich
                url: https://photos.peciulevicius.com
                check-url: http://immich_server:2283/api/server/ping
                icon: si:immich
              - title: Jellyfin
                url: https://watch.peciulevicius.com
                check-url: http://jellyfin:8096/health
                icon: si:jellyfin
              - title: Audiobookshelf
                url: https://listen.peciulevicius.com
                check-url: http://audiobookshelf:80/
                icon: si:audiobookshelf
              - title: Calibre-Web
                url: https://books.peciulevicius.com
                check-url: http://calibre_web:8083/
                icon: si:calibreweb
              - title: LazyLibrarian
                url: http://100.81.171.49:5299
                check-url: http://lazylibrarian:5299/
                icon: si:bookstack
              - title: Linkwarden
                url: https://links.peciulevicius.com
                check-url: http://linkwarden:3000/
                icon: si:bookstack
              - title: CouchDB (Obsidian sync)
                url: https://couchdb.peciulevicius.com
                check-url: http://couchdb:5984/_up
                icon: si:apachecouchdb
              - title: Paperclip (agents)
                url: http://100.81.171.49:3100
                check-url: http://paperclip:3100/api/health
                icon: mdi:paperclip
              - title: TrainingPeaks MCP
                url: http://127.0.0.1:8092/status
                check-url: http://trainingpeaks-mcp:8000/status
                icon: si:trainingpeaks
              - title: Strava MCP
                url: http://127.0.0.1:8093/status
                check-url: http://strava-mcp:8000/status
                icon: si:strava
              - title: Pi-hole
                url: https://pihole.peciulevicius.com/admin/
                check-url: http://pihole:80/admin/
                icon: si:pihole
              - title: Portainer
                url: https://portainer.peciulevicius.com
                check-url: http://portainer:9000/
                icon: si:portainer
              - title: Uptime Kuma
                url: https://status.peciulevicius.com
                check-url: http://uptime_kuma:3001/
                icon: si:uptimekuma
              - title: UGREEN NAS
                url: https://nas.peciulevicius.com
                check-url: http://DH4300PLUS-DP.local:9999/
                alt-status-codes:
                  - 307
                icon: di:ugreen
              - title: Jellyseerr
                url: http://100.81.171.49:5055
                check-url: http://jellyseerr:5055/
                icon: si:jellyfin
              - title: Bazarr
                url: http://100.81.171.49:6767
                check-url: http://bazarr:6767/
                icon: di:bazarr
              - title: Transmission
                url: http://100.81.171.49:9091
                # `transmission` is a network alias on the transmission-ts
                # sidecar; the web UI always answers 401 without a login.
                check-url: http://transmission:9091/transmission/web/
                alt-status-codes:
                  - 401
                icon: si:transmission
          - type: bookmarks
            groups:
              - title: Main
                links:
                  - title: Vaultwarden
                    url: https://vault.peciulevicius.com
                    icon: si:bitwarden
                  - title: Immich
                    url: https://photos.peciulevicius.com
                    icon: si:immich

              - title: Media
                links:
                  - title: Jellyfin
                    url: https://watch.peciulevicius.com
                    icon: si:jellyfin
                  - title: Audiobookshelf
                    url: https://listen.peciulevicius.com
                    icon: si:audiobookshelf
                  - title: Calibre-Web
                    url: https://books.peciulevicius.com
                    icon: si:calibreweb

              - title: Utilities
                links:
                  - title: Linkwarden
                    url: https://links.peciulevicius.com
                    icon: si:bookstack
                  - title: Pi-hole
                    url: https://pihole.peciulevicius.com/admin/
                    icon: si:pihole

              # Stopped by default to save RAM — no monitor (it would sit red).
              # Start one first: `ondemand start <name>` (scripts/utils/ondemand.sh).
              - title: On demand (ondemand start <name>)
                links:
                  - title: Nextcloud
                    url: https://cloud.peciulevicius.com
                    icon: si:nextcloud
                  - title: Paperless-ngx
                    url: https://papers.peciulevicius.com
                    icon: si:paperlessngx
                  - title: Odysseus (AI)
                    url: http://100.81.171.49:7001
                    icon: si:ollama
                  - title: Stirling PDF
                    url: https://pdf.peciulevicius.com
                    icon: si:files
                  - title: IT-Tools
                    url: https://tools.peciulevicius.com
                    icon: si:hackthebox
                  - title: Storyteller
                    url: http://100.81.171.49:8087
                    icon: si:bookstack

              - title: Direct (no tunnel — for uploads >100MB)
                links:
                  - title: Immich
                    url: http://100.81.171.49:2283
                    icon: si:immich
                  - title: Nextcloud
                    url: http://100.81.171.49:8080
                    icon: si:nextcloud
                  - title: Paperless-ngx
                    url: http://100.81.171.49:8000
                    icon: si:files
                  - title: Calibre-Web
                    url: http://100.81.171.49:8083
                    icon: si:calibreweb

              - title: System
                links:
                  - title: Portainer
                    url: https://portainer.peciulevicius.com
                    icon: si:portainer
                  - title: Uptime Kuma
                    url: https://status.peciulevicius.com
                    icon: si:uptimekuma

              - title: Tailscale Only
                links:
                  - title: Sonarr
                    url: http://100.81.171.49:8989
                    icon: si:sonarr
                  - title: Radarr
                    url: http://100.81.171.49:7878
                    icon: si:radarr
                  - title: Prowlarr
                    url: http://100.81.171.49:9696
                    icon: di:prowlarr
                  - title: Transmission
                    url: http://100.81.171.49:9091
                    icon: si:transmission
                  - title: Syncthing
                    url: http://100.81.171.49:8384
                    icon: si:syncthing
                  - title: Jellyseerr
                    url: http://100.81.171.49:5055
                    icon: si:jellyfin
                  - title: Bazarr
                    url: http://100.81.171.49:6767
                    icon: di:bazarr
                  - title: Paperclip (agents)
                    url: http://100.81.171.49:3100
                    icon: mdi:paperclip

          - type: docker-containers
            # On-demand services (ondemand.sh) are stopped by default and would
            # otherwise list red. Unexpected stops are caught by the monitors
            # above, Uptime Kuma and the weekly homelab-audit.sh.
            running-only: true

      - size: small
        widgets:
          - type: weather
            location: Vilnius, Lithuania
            units: metric

          - type: clock

  - name: Feed
    columns:
      - size: small
        widgets:
          - type: search
            search-engine: duckduckgo

          - type: releases
            title: GitHub Releases
            repositories:
              - immich-app/immich
              - glanceapp/glance
              - dani-garcia/vaultwarden
              - jellyfin/jellyfin
              - hoarder-app/hoarder
            token: ${GITHUB_TOKEN}

          - type: lobsters

      - size: full
        widgets:
          - type: hacker-news
            limit: 15
            collapse-after: 5

          - type: reddit
            title: Tech
            subreddit: selfhosted+homelab+linux+programming+technology+webdev+typescript
            limit: 15
            collapse-after: 5

          - type: reddit
            title: Business
            subreddit: SaaS+startups+Entrepreneur+indiehackers
            limit: 15
            collapse-after: 5

          - type: reddit
            title: Lithuanian
            subreddit: lietuva+6nuliai
            limit: 15
            collapse-after: 5

      - size: small
        widgets:
          - type: rss
            title: Blogs & Essays
            limit: 15
            collapse-after: 5
            feeds:
              - url: https://www.saastr.com/feed/
                title: SaaStr
              - url: https://hnrss.org/show
                title: Show HN
              - url: https://seths.blog/feed/
                title: Seth Godin
              - url: https://world.hey.com/dhh/feed.atom
                title: DHH

  - name: Media
    columns:
      - size: small
        widgets:
          - type: bookmarks
            groups:
              - title: Watch
                links:
                  - title: Jellyfin
                    url: https://watch.peciulevicius.com
                    icon: si:jellyfin
                  - title: Jellyseerr
                    url: http://100.81.171.49:5055
                    icon: si:jellyfin
              - title: Manage
                links:
                  - title: Sonarr
                    url: http://100.81.171.49:8989
                    icon: si:sonarr
                  - title: Radarr
                    url: http://100.81.171.49:7878
                    icon: si:radarr
                  - title: Prowlarr
                    url: http://100.81.171.49:9696
                    icon: di:prowlarr
                  - title: Bazarr
                    url: http://100.81.171.49:6767
                    icon: di:bazarr
                  - title: Transmission
                    url: http://100.81.171.49:9091
                    icon: si:transmission
                  - title: LazyLibrarian
                    url: http://100.81.171.49:5299
                    icon: si:bookstack
              - title: Books & Audio
                links:
                  - title: Audiobookshelf
                    url: https://listen.peciulevicius.com
                    icon: si:audiobookshelf
                  - title: Calibre-Web
                    url: https://books.peciulevicius.com
                    icon: si:calibreweb
                  - title: LazyLibrarian
                    url: http://100.81.171.49:5299
                    icon: si:bookstack

          - type: releases
            title: Media App Updates
            repositories:
              - jellyfin/jellyfin
              - Sonarr/Sonarr
              - Radarr/Radarr
              - morpheus65535/bazarr
              - fallenbagel/jellyseerr
            token: ${GITHUB_TOKEN}

      - size: full
        widgets:
          - type: reddit
            title: What to Watch
            subreddit: NetflixBestOf+Documentaries+MovieSuggestions+television+movies
            limit: 15
            collapse-after: 5

          - type: reddit
            title: Piracy & Self-Hosted Media
            subreddit: Piracy+selfhosted+PleX+jellyfin
            limit: 10
            collapse-after: 5

  - name: Finance
    columns:
      - size: small
        widgets:
          - type: markets
            title: Portfolio
            markets:
              - symbol: BTC-EUR
                name: Bitcoin
              - symbol: ETH-EUR
                name: Ethereum
              - symbol: VUAA.DE
                name: VUAA (S&P 500)
              - symbol: VWCE.DE
                name: VWCE (All World)
              - symbol: AAPL
                name: Apple
              - symbol: GOOGL
                name: Google
              - symbol: AMZN
                name: Amazon
              - symbol: MSFT
                name: Microsoft
              - symbol: NVDA
                name: Nvidia
              - symbol: MSTR
                name: MicroStrategy

      - size: full
        widgets:
          - type: reddit
            title: Personal Finance
            subreddit: eupersonalfinance+financialindependence+Fire+investing
            limit: 15
            collapse-after: 5
