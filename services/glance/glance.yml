                icon: si:strava
              - title: Sonarr
                url: http://100.81.171.49:8989
                check-url: http://sonarr:8989/
                icon: si:sonarr
              - title: Radarr
                url: http://100.81.171.49:7878
                check-url: http://radarr:7878/
                icon: si:radarr
              - title: Prowlarr
                url: http://100.81.171.49:9696
                check-url: http://prowlarr:9696/
                icon: di:prowlarr
              - title: Transmission
                url: http://100.81.171.49:9091
                # `transmission` is a network alias on the transmission-ts
                # sidecar; the web UI always answers 401 without a login.
                check-url: http://transmission:9091/transmission/web/
                alt-status-codes:
                  - 401
                icon: si:transmission
              - title: LazyLibrarian
                url: http://100.81.171.49:5299
                check-url: http://lazylibrarian:5299/
                icon: si:bookstack
              - title: Calibre (library manager)
                url: http://100.81.171.49:8888
                check-url: http://calibre:8080/
                icon: mdi:bookshelf
              - title: Uptime Kuma
                url: https://status.peciulevicius.com
                check-url: http://uptime_kuma:3001/
                icon: si:uptimekuma
              - title: Portainer
                url: https://portainer.peciulevicius.com
                check-url: http://portainer:9000/
                icon: si:portainer
              - title: WUD (image updates)
                url: http://100.81.171.49:3070
                check-url: http://wud:3000/health
                icon: mdi:update
              - title: CouchDB (Obsidian sync)
                url: https://couchdb.peciulevicius.com
                check-url: http://couchdb:5984/_up
                icon: si:apachecouchdb
              - title: Radicale (calendar/contacts)
                url: http://100.81.171.49:5232/.web/
                check-url: http://radicale:5232/.web/
                icon: mdi:calendar-sync
              - title: FreshRSS
                url: https://rss.peciulevicius.com
                check-url: http://freshrss:80/
                icon: mdi:rss
              - title: UGREEN NAS
                url: https://nas.peciulevicius.com
                check-url: http://DH4300PLUS-DP.local:9999/
                timeout: 5s
                alt-status-codes:
                  - 307
                icon: di:ugreen

          # ── Every service, grouped by purpose. Scale-to-zero apps (Sablier,
          # services/caddy) have no check-url so Glance never wakes them just
          # by rendering this page; their live state is the "Sleeping apps"
          # widget in the side column.
          - type: bookmarks
            groups:
              - title: Media
                links:
                  - title: Jellyfin
                    url: https://watch.peciulevicius.com
                    icon: si:jellyfin
                  - title: Jellyseerr
                    url: http://100.81.171.49:5055
                    icon: si:jellyfin
                  - title: Audiobookshelf
                    url: https://listen.peciulevicius.com
                    icon: si:audiobookshelf
                  - title: Calibre-Web
                    url: https://books.peciulevicius.com
                    icon: si:calibreweb
                  - title: Calibre (library manager)
                    url: http://100.81.171.49:8888
                    icon: mdi:bookshelf
                  - title: Sonarr
                    url: http://100.81.171.49:8989
                    icon: si:sonarr
                  - title: Radarr
                    url: http://100.81.171.49:7878
                    icon: si:radarr
                  - title: Prowlarr
                    url: http://100.81.171.49:9696
                    icon: di:prowlarr
                  - title: Bazarr
                    url: http://100.81.171.49:6767
                    icon: di:bazarr
                  - title: Transmission
                    url: http://100.81.171.49:9091
                    icon: si:transmission
                  - title: LazyLibrarian
                    url: http://100.81.171.49:5299
                    icon: si:bookstack

              - title: Files & Docs
                links:
                  - title: Immich
                    url: https://photos.peciulevicius.com
                    icon: si:immich
                  - title: Nextcloud
                    url: https://cloud.peciulevicius.com
                    icon: si:nextcloud
                  - title: Paperless-ngx
                    url: https://papers.peciulevicius.com
                    icon: si:paperlessngx
                  - title: Syncthing
                    url: http://100.81.171.49:8384
                    icon: si:syncthing
                  - title: Radicale (calendar/contacts)
                    url: http://100.81.171.49:5232/.web/
                    icon: mdi:calendar-sync
                  - title: Stirling PDF
                    url: https://pdf.peciulevicius.com
                    icon: si:files
                  - title: Linkwarden
                    url: https://links.peciulevicius.com
                    icon: si:bookstack

              - title: Security & Network
                links:
                  - title: Vaultwarden
                    url: https://vault.peciulevicius.com
                    icon: si:bitwarden
                  - title: Pi-hole
                    url: https://pihole.peciulevicius.com/admin/
                    icon: si:pihole
                  - title: Tailscale (admin console)
                    url: https://login.tailscale.com/admin/machines
                    icon: si:tailscale

              - title: AI & Agents
                links:
                  - title: Paperclip (agents)
                    url: http://100.81.171.49:3100
                    icon: mdi:paperclip
                  - title: Odysseus (AI)
                    url: http://100.81.171.49:7001
                    icon: si:ollama
                  - title: TrainingPeaks MCP
                    url: http://127.0.0.1:8092/status
                    icon: si:trainingpeaks
                  - title: Strava MCP
                    url: http://127.0.0.1:8093/status
                    icon: si:strava

              - title: Ops
                links:
                  - title: Uptime Kuma
                    url: https://status.peciulevicius.com
                    icon: si:uptimekuma
                  - title: Portainer
                    url: https://portainer.peciulevicius.com
                    icon: si:portainer
                  - title: WUD (image updates)
                    url: http://100.81.171.49:3070
                    icon: mdi:update
                  - title: Glance
                    url: https://home.peciulevicius.com
                    icon: mdi:view-dashboard
                  - title: Caddy + Sablier (no web UI — README)
                    url: https://github.com/peciulevicius/.dotfiles/blob/main/services/caddy/README.md
                    icon: si:caddy
                  # unbound: DNS-only (no HTTP), so no monitor/check-url —
                  # Pi-hole's dns-stats widget failing is the visible signal.
                  - title: Unbound (encrypted DNS — README)
                    url: https://github.com/peciulevicius/.dotfiles/blob/main/services/pihole/README.md
                    icon: mdi:lock-outline
                  - title: UGREEN NAS
                    url: https://nas.peciulevicius.com
                    icon: di:ugreen
                  - title: CouchDB (Obsidian sync)
                    url: https://couchdb.peciulevicius.com
                    icon: si:apachecouchdb
                  - title: IT-Tools
                    url: https://tools.peciulevicius.com
                    icon: si:hackthebox
                  - title: FreshRSS
                    url: https://rss.peciulevicius.com
                    icon: mdi:rss

          # ── Live status — which containers Glance can actually see running
          # right now, on any joined network. This is how a Sablier sleeper's
          # current "awake" state shows up WITHOUT Glance ever polling it
          # directly: when a sleeping service wakes (someone opens it), its
          # container appears here; once Sablier stops it again, it drops
          # back out. running-only keeps stopped/asleep containers from
          # cluttering this with permanent red tiles.
          - type: docker-containers
            title: Live Status (running containers)
            running-only: true

      - size: small
        widgets:
          # ── Today — Radicale calendars + open tasks, from
          # ./assets/calendar.json written every 5 min by
          # scripts/utils/calendar-status.sh (reads CalDAV on the host; Glance
          # only reads the local file).
          - type: custom-api
            title: Today
            cache: 1m
            url: http://localhost:8080/assets/calendar.json
            template: |
              {{ if .JSON.Bool "ok" }}
              <ul class="list list-gap-4">
                {{ range .JSON.Array "today" }}<li class="flex justify-between"><span>{{ .String "title" }}</span><span class="color-subdue nowrap">{{ .String "time" }}</span></li>{{ else }}<li class="color-subdue size-h6">Nothing today</li>{{ end }}
              </ul>
              <div class="size-h6 color-subdue" style="margin-top:10px">Tomorrow</div>
              <ul class="list list-gap-4" style="margin-top:4px">
                {{ range .JSON.Array "tomorrow" }}<li class="flex justify-between size-h6"><span>{{ .String "title" }}</span><span class="color-subdue nowrap">{{ .String "time" }}</span></li>{{ else }}<li class="color-subdue size-h6">Nothing planned</li>{{ end }}
              </ul>
              {{ if .JSON.Array "tasks" }}
              <div class="size-h6 color-subdue" style="margin-top:10px">Tasks</div>
              <ul class="list list-gap-4" style="margin-top:4px">
                {{ range .JSON.Array "tasks" }}<li class="flex justify-between size-h6"><span>☐ {{ .String "title" }}</span><span class="nowrap {{ if .Bool "overdue" }}lvl-bad{{ else }}color-subdue{{ end }}">{{ .String "due" }}</span></li>{{ end }}
              </ul>
              {{ end }}
              {{ else }}
              <p class="lvl-warn size-h6">Calendar unavailable — {{ .JSON.String "error" }}</p>
              {{ end }}

          # ── Training + Coach team (right column) — from the same status.json
          # as the Server widget in the left column: TrainingPeaks numbers cached 30 min by the script,
          # the latest Coach check-in comment and the Dietitian's today line.
          - type: custom-api
            title: Training
            cache: 1m
            url: http://localhost:8080/assets/status.json
            template: |
              <div class="flex justify-between items-center">
                <span class="size-h6 color-subdue">IRONMAN 70.3 Luxembourg</span>
                <span class="size-h4 color-highlight">{{ .JSON.Int "training.race_days" }} days</span>
              </div>
              {{ if .JSON.Bool "training.ok" }}
              <ul class="list list-gap-10" style="margin-top:10px">
                <li class="flex justify-between" title="Form = TSB (fitness CTL − fatigue ATL). {{ .JSON.String "training.fitness.status" }}"><span>Form</span>
                  <span class="nowrap"><span class="lvl-{{ .JSON.String "training.fitness.level" }}">{{ .JSON.Int "training.fitness.tsb" }}</span> <span class="color-subdue">fit {{ .JSON.Int "training.fitness.ctl" }} · fatigue {{ .JSON.Int "training.fitness.atl" }}</span></span></li>
                <li class="flex justify-between" title="change vs 7 days ago"><span>Weight</span>
                  <span>{{ .JSON.String "training.weight.now" }} kg <span class="color-subdue">{{ .JSON.String "training.weight.delta" }}</span></span></li>
                <li class="flex justify-between" title="change vs 7 days ago"><span>Body fat</span>
                  <span>{{ .JSON.String "training.fat.now" }}% <span class="color-subdue">{{ .JSON.String "training.fat.delta" }}</span></span></li>
                <li class="flex justify-between"><span>Night</span>
                  <span class="nowrap">{{ .JSON.String "training.recovery" }}</span></li>
                <li class="flex justify-between" title="sessions completed / planned this week"><span>Week</span>
                  <span class="nowrap">{{ .JSON.Int "training.week.done" }}/{{ .JSON.Int "training.week.planned" }} · {{ .JSON.Int "training.week.tss" }} TSS · {{ .JSON.Float "training.week.hours" }} h</span></li>
                <li><div class="size-h6 color-subdue">Today</div><div class="size-h5">{{ .JSON.String "training.today" }}</div></li>
              </ul>
              {{ else }}
              <p class="lvl-warn" style="margin-top:10px">{{ .JSON.String "training.error" }} — refresh the cookie (services/trainingpeaks-mcp/README.md)</p>
              {{ end }}

          - type: custom-api
            title: Coach team
            cache: 1m
            url: http://localhost:8080/assets/status.json
            template: |
              <div class="flex justify-between"><span class="size-h6 color-subdue">Latest check-in</span>
                <span class="size-h6 lvl-{{ .JSON.String "coach.checkin.level" }}">{{ .JSON.String "coach.checkin.age" }}</span></div>
              <ul class="list list-gap-4" style="margin-top:6px">
                {{ range .JSON.Array "coach.summary" }}<li class="size-h6">{{ .String "" }}</li>{{ end }}
              </ul>
              <div class="size-h6 color-subdue" style="margin-top:10px">Dietitian today</div>
              <div class="size-h5">{{ .JSON.String "coach.today" }}</div>
              <div class="flex justify-between" style="margin-top:10px">
                <span>Waiting on you</span>
                <span class="lvl-{{ .JSON.String "paperclip.level" }}">{{ if .JSON.Bool "paperclip.reachable" }}{{ .JSON.Int "paperclip.approvals" }} approvals · {{ .JSON.Int "paperclip.waiting" }} in review{{ else }}Paperclip unreachable{{ end }}</span>
              </div>
              <div class="flex gap-10 size-h6" style="margin-top:10px; flex-wrap:wrap">
                <a class="color-highlight" href="https://discord.com/channels/1484527236798484602/1553523070348820661" target="_blank">💬 Coach</a>
                <a class="color-highlight" href="https://discord.com/channels/1484527236798484602/1553768855975763998" target="_blank">💬 Dietitian</a>
                <a class="color-highlight" href="http://100.81.171.49:3100" target="_blank">📎 Paperclip</a>
              </div>

          - type: repository
            repository: peciulevicius/.dotfiles
            token: ${GITHUB_TOKEN}

          - type: calendar

