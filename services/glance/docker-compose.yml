services:
  glance:
    container_name: glance
    image: glanceapp/glance
    restart: unless-stopped
    volumes:
      - ./glance.yml:/app/config/glance.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - ${GLANCE_PORT:-7575}:8080
    env_file:
      - .env
    networks:
      - default
      - vaultwarden
      - nextcloud
      - immich_default
      - paperless-ngx
      - jellyfin
      - audiobookshelf
      - calibre-web
      - linkwarden
      - freshrss
      - stirling-pdf
      - it-tools
      - pihole
      - portainer
      - uptime-kuma
      - media
      - lazylibrarian
      - couchdb
      - odysseus_default
      - trainingpeaks-mcp_default
      - strava-mcp_default
      - beets

networks:
  default:
  vaultwarden:
    external: true
  nextcloud:
    external: true
  immich_default:
    external: true
  paperless-ngx:
    external: true
  jellyfin:
    external: true
