# Calibre — full library manager + Content Server for Readarr integration
# GUI (KasmVNC): http://100.81.171.49:8888
# Content Server (internal): http://calibre:8081 — used by Readarr
# Note: port 8080 inside this image is nginx (KasmVNC GUI), not the content server
#
# Readarr integration: Settings → Media Management → Use Calibre
#   Host: calibre   Port: 8081   Library: /books

name: calibre

services:
  calibre:
    container_name: calibre
    image: linuxserver/calibre:latest
    restart: unless-stopped
    ports:
      - "${CALIBRE_PORT:-8888}:8080"   # KasmVNC web GUI (nginx inside uses 8080, not 3000)
    volumes:
      - ./data:/config
      - ${BOOKS_DIR:-/Volumes/books}:/books
      - ./start-content-server.sh:/custom-cont-init.d/99-content-server.sh:ro
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Vilnius}
    networks:
      - default
      - calibre-web

networks:
  default:
    name: calibre
  calibre-web:
    external: true
