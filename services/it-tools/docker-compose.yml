# IT-Tools — developer utilities collection
# Docs: https://github.com/CorentinTh/it-tools

name: it-tools

services:
  it-tools:
    container_name: it_tools
    image: corentinth/it-tools:2024.10.22-7ca5933
    restart: unless-stopped
    ports:
      - "${TOOLS_PORT:-8085}:80"
    environment:
      TZ: ${TZ:-Europe/Vilnius}
    # Scale-to-zero via Caddy + Sablier (services/caddy). Started/stopped by
    # Sablier, never by ondemand.sh — see services/caddy/README.md.
    labels:
      - "sablier.enable=true"
      - "sablier.group=it-tools"

networks:
  default:
    name: it-tools
