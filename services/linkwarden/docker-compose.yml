# Linkwarden — bookmark manager with archiving
# Docs: https://github.com/linkwarden/linkwarden

name: linkwarden

services:
  linkwarden:
    container_name: linkwarden
    image: ghcr.io/linkwarden/linkwarden:v2.16.3
    restart: unless-stopped
    # Scale-to-zero via Caddy + Sablier (services/caddy). Starts/stops with
    # the rest of the `linkwarden` group — see services/caddy/README.md.
    labels:
      - "sablier.enable=true"
      - "sablier.group=linkwarden"
    ports:
      - "${LW_PORT:-3005}:3000"
    volumes:
      - ./data:/data/data
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@linkwarden-db:5432/linkwarden
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changeme}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3005}
    depends_on:
      - linkwarden-db
    # Sablier starts the app and its database at the same instant (`docker
    # start` ignores depends_on). The app's first step, `prisma migrate
    # deploy`, then fails with P1001 in under 10 s — too fast for the restart
    # policy to kick in — and Linkwarden stays down (2026-10-10). Wait for the
    # DB port first (node: the image has no nc), then run the image's own CMD.
    command:
      - sh
      - -c
      - >-
        node -e 'const n=require("net");(function t(i){const s=n.connect(5432,"linkwarden-db");s.on("connect",()=>{s.end();process.exit(0)});s.on("error",()=>{s.destroy();if(i>120)process.exit(1);setTimeout(()=>t(i+1),1000)})})(0)' &&
        export PATH=/data/node_modules/.bin:$$PATH &&
        prisma migrate deploy --schema=/data/packages/prisma/schema.prisma &&
        exec concurrently -k -n web,worker "cd /data/apps/web && exec next start" "cd /data/apps/worker && exec tsx worker.ts"

  linkwarden-db:
    container_name: linkwarden_db
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      - "sablier.enable=true"
      - "sablier.group=linkwarden"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: linkwarden

networks:
  default:
    name: linkwarden
