# Pi-hole — network-wide ad blocker + local DNS
# Docs: https://github.com/pi-hole/docker-pi-hole
# v6 (2025+): lighttpd/PHP replaced by FTL's embedded webserver, config lives in
# /etc/pihole/pihole.toml, env vars are FTLCONF_<section>_<key>.
# v5 -> v6 upgrade notes: https://docs.pi-hole.net/docker/upgrading/v5-v6/

name: pihole

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.09.0
    restart: unless-stopped
    ports:
      - "${PIHOLE_WEB_PORT:-8053}:80"
      - "${PIHOLE_DNS_PORT:-53}:53/tcp"
      - "${PIHOLE_DNS_PORT:-53}:53/udp"
    volumes:
      - ./data/etc-pihole:/etc/pihole
      # v6 ignores this dir unless FTLCONF_misc_etc_dnsmasq_d=true; kept mounted
      # only so the one-time v5 -> v6 migration can read the old files.
      - ./data/etc-dnsmasq.d:/etc/dnsmasq.d
    environment:
      TZ: ${TZ:-Europe/Vilnius}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in .env}
      FTLCONF_dns_upstreams: ${UPSTREAM_DNS:-1.1.1.1;1.0.0.1}
      # Docker bridge: queries arrive from the bridge gateway, not the LAN, so
      # the default "LOCAL" mode would refuse them.
      FTLCONF_dns_listeningMode: ALL
    cap_add:
      - NET_ADMIN

networks:
  default:
    name: pihole
