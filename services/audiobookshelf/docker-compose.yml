# Audiobookshelf — audiobook and podcast server
# Docs: https://github.com/advplyr/audiobookshelf

name: audiobookshelf

services:
  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:2.37.1
    restart: unless-stopped
    # Scale-to-zero via Caddy + Sablier (services/caddy), phase 3, 2h idle
    # (long enough not to cut off playback). Caddy now also owns the
    # Tailscale-facing port (100.81.171.49:13378) so the phone app wakes it
    # too on LAN — this bind is loopback-only debug access. No
    # image-provided healthcheck, no curl in this image (only wget) — see
    # the Caddy README "Gotchas".
    labels:
      - "sablier.enable=true"
      - "sablier.group=audiobookshelf"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    ports:
      - "127.0.0.1:${ABS_PORT:-13378}:80"
    volumes:
      - audiobooks:/audiobooks
      - ${PODCASTS_DIR:-./data/podcasts}:/podcasts
      - ./data/config:/config
      - ./data/metadata:/metadata
    environment:
      TZ: ${TZ:-Europe/Vilnius}

networks:
  default:
    name: audiobookshelf

# NAS shares over NFS, mounted by Docker's VM directly instead of the macOS
# SMB mounts under /Volumes (those went stale after NAS reboots). Same paths
# inside the containers. See docs/HOME_SERVER_REFERENCE.md → NAS over NFS.
volumes:
  audiobooks:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_IP:-192.168.1.73},nfsvers=3,nolock,hard,rw"
      device: ":/volume1/audiobooks"
